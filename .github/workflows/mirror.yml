name: mirror

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck -S warning mirror.sh
      - name: Mirror the newest source releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash mirror.sh
